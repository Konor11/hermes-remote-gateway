name: hermes-remote-gateway
version: "0.2.0"
description: "CLI plugin to connect Hermes CLI to a remote Hermes gateway via WebSocket with OAuth/Token/Basic Auth"
author: "DKTunnel"
license: "MIT"
manifest_version: 2
kind: standalone
provides_tools: []
capabilities: []
requires_plugins: []
pip_dependencies:
  - aiohttp>=3.8.0
  - pyyaml>=6.0
config_schema:
  remote_gateway:
    type: object
    description: "Remote gateway connection settings"
    properties:
      url:
        type: string
        description: "Remote gateway URL (e.g., https://mydomen.com)"
      auth:
        type: string
        enum: ["oauth", "token", "basic"]
        description: "Authentication mode"
        default: "oauth"
      token:
        type: string
        description: "Session token (for token auth)"
      username:
        type: string
        description: "Username (for basic auth)"
      password:
        type: string
        description: "Password (for basic auth)"
      profile:
        type: string
        description: "Remote profile name"
        default: "default"
      direct:
        type: boolean
        description: "Point the TUI straight at the domain (no local proxy). Dashboard must be ungated."
        default: false
      local_pc_access:
        type: boolean
        description: "Let the remote agent run terminal/file tools on THIS laptop (reverse SSH tunnel)"
        default: false
      local_pc_ssh_port:
        type: integer
        description: "Loopback port on the remote host that forwards to this laptop's sshd"
        default: 2222
      local_pc_server_user:
        type: string
        description: "SSH user on the remote host (used to install the tunnel key)"
        default: "root"
      local_pc_laptop_user:
        type: string
        description: "SSH user on THIS laptop (default: $USER)"
        default: ""
      auto_reconnect:
        type: boolean
        description: "Auto-reconnect on disconnect"
        default: true
      reconnect_attempts:
        type: integer
        description: "Max reconnection attempts"
        default: 5
      reconnect_delay:
        type: number
        description: "Initial reconnection delay (seconds)"
        default: 2.0